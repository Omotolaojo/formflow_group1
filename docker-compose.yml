version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: expense-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: expense_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - expense-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: expense-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

        command: sh -c "npx prisma migrate deploy && npm start"

    environment:
      NODE_ENV: production

      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/expense_db

      PORT: 5000

    ports:
      - "5000:5000"

    networks:
      - expense-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: expense-frontend

    restart: unless-stopped

    depends_on:
      - backend

    environment:
      NEXT_PUBLIC_API_URL: http://backend:5000

    ports:
      - "3000:3000"

    networks:
      - expense-network


volumes:
  postgres_data:


networks:
  expense-network:
    driver: bridge

    