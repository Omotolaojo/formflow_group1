services:

  postgres:
    image: postgres:16-alpine
    container_name: expense-postgres
    restart: unless-stopped

    env_file:
      - .env.production

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_claims"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - expense


  backend:
    image: kunzydev/expense-backend:${IMAGE_TAG}
    container_name: expense-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env.production
      - .env.production.backend

    networks:
      - expense


  frontend:
    image: kunzydev/expense-frontend:${IMAGE_TAG}
    container_name: expense-frontend
    restart: unless-stopped

    depends_on:
      - backend

    env_file:
      - .env.production
      - .env.production.frontend

    networks:
      - expense


  nginx:
    image: kunzydev/expense-nginx:${IMAGE_TAG}
    container_name: expense-nginx
    restart: unless-stopped

    depends_on:
      - frontend
      
      - backend

    ports:
      - "80:80"

    networks:
      - expense


volumes:
  postgres_data:


networks:
  expense:
    driver: bridge